# SP-DEP-003 Nginx 反代 + 限流（默认 30 req/s）+ gzip（SSE 除外）
# SSE 要求：proxy_buffering off + proxy_read_timeout ≥ 120s；限流 429 → 统一 JSON（code=4290）
#
# HTTPS（自签演示，可选）：openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout /etc/nginx/ssl/demo.key -out /etc/nginx/ssl/demo.crt -subj "/CN=localhost"
# 取消 443 server 块注释并挂载证书即可启用。

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_min_length 1k;
    # text/event-stream 不在 gzip_types 内 → SSE 不压缩（协议要求）
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 关键项（SP-SSE-001 / SP-DEP-003）
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
        # 限流命中 → 统一 JSON 包装（SP-API-GEN：code=4290）
        error_page 429 = @rate_limited;
    }

    location = @rate_limited {
        default_type application/json;
        add_header Cache-Control no-store;
        return 429 '{"code":4290,"message":"请求过于频繁，请稍后再试","data":null,"trace_id":"rate_limited"}';
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
}

